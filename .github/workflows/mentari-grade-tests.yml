name: Mentari grade recap tests

on:
  pull_request:
    paths:
      - 'server.js'
      - 'public/app.js'
      - 'public/grade-recap.js'
      - 'public/index.html'
      - 'src/features/mentari/**'
      - 'tests/mentari/**'
      - 'supabase/migrations/**'
      - '.github/workflows/mentari-grade-tests.yml'
  push:
    branches: [main]
    paths:
      - 'src/features/mentari/**'
      - 'tests/mentari/**'
      - '.github/workflows/mentari-grade-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --check server.js
      - run: node --check public/app.js
      - run: node --check public/grade-recap.js
      - run: node --check src/features/mentari/grade-import.js
      - run: node --check tools/mentari/collector-v2.user.js
      - run: node --test tests/mentari/*.test.js tests/security/*.test.js

  migration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gridkelas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gridkelas_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Prepare isolated database roles and app_data fixture
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d gridkelas_test -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE service_role NOLOGIN BYPASSRLS;
          CREATE TABLE public.app_data (
            key TEXT PRIMARY KEY,
            content JSONB NOT NULL DEFAULT '{}'::jsonb
          );
          SQL
      - name: Apply migration on disposable PostgreSQL
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d gridkelas_test -v ON_ERROR_STOP=1 \
            -f supabase/migrations/20261123000100_mentari_personal_grade_recap.sql
          psql -h localhost -U postgres -d gridkelas_test -v ON_ERROR_STOP=1 \
            -f supabase/migrations/20261123000200_mentari_fis_meetings_21.sql
      - name: Exercise grade import RPC and history behavior
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d gridkelas_test -v ON_ERROR_STOP=1 \
            -f tests/mentari/grade-import.integration.sql
